<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CRP User Credentials Management Portal.">
    <title>User Management - CRP Amminbavi</title>
    <link rel="stylesheet" href="admin_style.css">
</head>

<body style="background-color: var(--clr-dashboard-bg);">

    <!-- Sticky Navigation Header -->
    <header class="nav-header">
        <div class="brand">
            <div class="brand-logo" aria-hidden="true">
                <img src="logo.png" alt="CRP Amminbavi Logo">
            </div>
            <span class="brand-name" id="brand-name">CRP Amminbavi</span>
        </div>

        <div class="admin-profile">
            <span class="admin-badge" id="admin-badge">SYSTEM ADMIN</span>
            <!-- Language Toggle Button -->
            <button type="button" class="btn-lang-toggle" id="lang-toggle-btn" aria-label="Switch Language to Kannada">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/>
                </svg>
                <span id="lang-btn-text">ಕನ್ನಡ</span>
            </button>
            <!-- Add User Button -->
            <button type="button" class="btn-add-user" id="add-user-btn" aria-label="Add User">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                    <circle cx="8" cy="7" r="4"/>
                    <line x1="20" y1="8" x2="20" y2="14"/>
                    <line x1="23" y1="11" x2="17" y2="11"/>
                </svg>
                <span id="add-user-btn-text">Add User</span>
            </button>
            <!-- Log Out Button -->
            <button type="button" class="btn-logout" id="logout-btn" aria-label="Log out of admin panel">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" />
                </svg>
                <span id="logout-btn-text">Log Out</span>
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="dashboard-container">

        <!-- Back & Title Section -->
        <header class="dashboard-header" style="margin-bottom: 24px;">
            <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px;">
                <button type="button" class="btn-lang-toggle" id="back-dashboard-btn" aria-label="Back to Admin Dashboard" style="border: 1.5px solid var(--clr-border); padding: 0 16px; border-radius: 8px; font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer; height: 36px;">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    <span id="back-btn-text">Back to Dashboard</span>
                </button>
            </div>
            <h2 id="page-title" style="margin: 0; font-size: 28px; font-weight: 800; color: var(--clr-text-main);">User Management</h2>
            <p id="page-subtitle" style="margin-top: 8px; color: var(--clr-text-muted); font-size: 14.5px;">Manage teacher account credentials, view passwords, and register new teachers.</p>
        </header>

        <!-- User Management Card / Section -->
        <section class="user-management-section" style="margin-top: 16px; margin-bottom: 32px;">
            <div style="background-color: #ffffff; border-radius: 12px; border: 1.5px solid var(--clr-border); padding: 24px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);">
                <div id="users-list-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 20px;">
                    <div id="users-loading-placeholder" style="text-align: center; color: var(--clr-text-muted); padding: 32px; grid-column: 1 / -1; font-weight: 600;">Loading teachers...</div>
                </div>
            </div>
        </section>

    </main>

    <!-- JS Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const getApiUrl = (endpoint) => {
                const isLocalFile = window.location.protocol === 'file:';
                if (isLocalFile) {
                    return `http://localhost:3000${endpoint}`;
                }
                if (window.location.port && window.location.port !== '3000') {
                    return `${window.location.protocol}//${window.location.hostname}:3000${endpoint}`;
                }
                return endpoint;
            };

            const logoutBtn = document.getElementById('logout-btn');
            const langToggleBtn = document.getElementById('lang-toggle-btn');
            const langBtnText = document.getElementById('lang-btn-text');
            const backDashboardBtn = document.getElementById('back-dashboard-btn');

            // Translations
            const translations = {
                en: {
                    brandName: "CRP Amminbavi",
                    adminBadge: "SYSTEM ADMIN",
                    logoutText: "Log Out",
                    pageTitle: "User Management",
                    pageSub: "Manage teacher account credentials, view passwords, and register new teachers.",
                    backBtnText: "Back to Dashboard",
                    addUserText: "Add User",
                    promptAddUserEmail: "Enter email of the new teacher:",
                    promptAddUserName: "Enter name of the new teacher (e.g. Teacher Ramesh):",
                    promptAddUserPassword: "Enter password for the new teacher (minimum 6 characters):",
                    addUserSuccess: "User added successfully!",
                    addUserFailed: "Failed to add user.",
                    addUserExists: "User already exists.",
                    noUsersRegistered: "No teachers registered yet.",
                    passwordLabel: "Password:",
                    showPasswordLabel: "Show",
                    hidePasswordLabel: "Hide",
                    deleteUserTooltip: "Delete Teacher",
                    deleteUserConfirm: "Are you sure you want to delete this teacher's account?",
                    deleteUserSuccess: "Teacher account deleted successfully.",
                    deleteUserFailed: "Failed to delete teacher account.",
                    editUserTooltip: "Edit Teacher Details",
                    promptEditUserName: "Enter new name (leave empty to keep current):",
                    promptEditUserPassword: "Enter new password (leave empty to keep current, minimum 6 characters):",
                    editUserSuccess: "Teacher account updated successfully!",
                    editUserFailed: "Failed to update teacher credentials."
                },
                kn: {
                    brandName: "ಸಿಆರ್ಪಿ ಅಮ್ಮಿನಬಾವಿ",
                    adminBadge: "ಸಿಸ್ಟಮ್ ಅಡ್ಮಿನ್",
                    logoutText: "ನಿರ್ಗಮಿಸಿ",
                    pageTitle: "ಬಳಕೆದಾರರ ನಿರ್ವಹಣೆ",
                    pageSub: "ಶಿಕ್ಷಕರ ಖಾತೆಯ ವಿವರಗಳು, ಗುಪ್ತಪದಗಳನ್ನು ನಿರ್ವಹಿಸಿ ಮತ್ತು ಹೊಸ ಶಿಕ್ಷಕರನ್ನು ನೊಂದಾಯಿಸಿ.",
                    backBtnText: "ಡ್ಯಾಶ್‌ಬೋರ್ಡ್‌ಗೆ ಹಿಂದಿರುಗಿ",
                    addUserText: "ಬಳಕೆದಾರರನ್ನು ಸೇರಿಸಿ",
                    promptAddUserEmail: "ಹೊಸ ಶಿಕ್ಷಕರ ಇಮೇಲ್ ನಮೂದಿಸಿ:",
                    promptAddUserName: "ಹೊಸ ಶಿಕ್ಷಕರ ಹೆಸರು ನಮೂದಿಸಿ (ಉದಾಹರಣೆಗೆ: ರಮೇಶ್):",
                    promptAddUserPassword: "ಹೊಸ ಶಿಕ್ಷಕರ ಗುಪ್ತಪದವನ್ನು ನಮೂದಿಸಿ (ಕನಿಷ್ಠ 6 ಅಕ್ಷರಗಳು):",
                    addUserSuccess: "ಬಳಕೆದಾರರನ್ನು ಯಶಸ್ವಿಯಾಗಿ ಸೇರಿಸಲಾಗಿದೆ!",
                    addUserFailed: "ಬಳಕೆದಾರರನ್ನು ಸೇರಿಸಲು ವಿಫಲವಾಗಿದೆ.",
                    addUserExists: "ಬಳಕೆದಾರರು ಈಗಾಗಲೇ ಅಸ್ತಿತ್ವದಲ್ಲಿದ್ದಾರೆ.",
                    noUsersRegistered: "ಇನ್ನೂ ಯಾವುದೇ ಶಿಕ್ಷಕರು ನೊಂದಾಯಿಸಲ್ಪಟ್ಟಿಲ್ಲ.",
                    passwordLabel: "ಗುಪ್ತಪದ:",
                    showPasswordLabel: "ತೋರಿಸು",
                    hidePasswordLabel: "ಮರೆಮಾಡು",
                    deleteUserTooltip: "ಶಿಕ್ಷಕರನ್ನು ಅಳಿಸಿ",
                    deleteUserConfirm: "ಈ ಶಿಕ್ಷಕರ ಖಾತೆಯನ್ನು ಅಳಿಸಲು ನೀವು ಖಚಿತವಾಗಿ ಬಯಸುವಿರಾ?",
                    deleteUserSuccess: "ಶಿಕ್ಷಕರ ಖಾತೆಯನ್ನು ಯಶಸ್ವಿಯಾಗಿ ಅಳಿಸಲಾಗಿದೆ.",
                    deleteUserFailed: "ಶಿಕ್ಷಕರ ಖಾತೆಯನ್ನು ಅಳಿಸಲು ವಿಫಲವಾಗಿದೆ.",
                    editUserTooltip: "ಶಿಕ್ಷಕರ ವಿವರಗಳನ್ನು ಸಂಪಾದಿಸಿ",
                    promptEditUserName: "ಹೊಸ ಹೆಸರನ್ನು ನಮೂದಿಸಿ (ಬದಲಾಯಿಸದಿದ್ದರೆ ಹಾಗೇ ಬಿಡಿ):",
                    promptEditUserPassword: "ಹೊಸ ಗುಪ್ತಪದವನ್ನು ನಮೂದಿಸಿ (ಬದಲಾಯಿಸದಿದ್ದರೆ ಹಾಗೇ ಬಿಡಿ, ಕನಿಷ್ಠ 6 ಅಕ್ಷರಗಳು):",
                    editUserSuccess: "ಶಿಕ್ಷಕರ ವಿವರಗಳನ್ನು ಯಶಸ್ವಿಯಾಗಿ ನವೀಕರಿಸಲಾಗಿದೆ!",
                    editUserFailed: "ಶಿಕ್ಷಕರ ವಿವರಗಳನ್ನು ನವೀಕರಿಸಲು ವಿಫಲವಾಗಿದೆ."
                }
            };

            let currentLang = 'en';

            const applyTranslations = () => {
                const data = translations[currentLang];

                // Header
                document.getElementById('brand-name').textContent = data.brandName;
                document.getElementById('admin-badge').textContent = data.adminBadge;
                document.getElementById('logout-btn-text').textContent = data.logoutText;

                const addUsrText = document.getElementById('add-user-btn-text');
                if (addUsrText) addUsrText.textContent = data.addUserText;

                // Page titles
                document.getElementById('page-title').textContent = data.pageTitle;
                document.getElementById('page-subtitle').textContent = data.pageSub;
                document.getElementById('back-btn-text').textContent = data.backBtnText;

                // Toggle language button label
                langBtnText.textContent = currentLang === 'en' ? 'ಕನ್ನಡ' : 'English';
                langToggleBtn.setAttribute('aria-label', currentLang === 'en' ? 'Switch Language to Kannada' : 'Switch Language to English');
            };

            // Switch Language
            langToggleBtn.addEventListener('click', () => {
                currentLang = currentLang === 'en' ? 'kn' : 'en';
                applyTranslations();
                renderUsersList();
            });

            let cachedUsers = [];

            const renderUsersList = () => {
                const container = document.getElementById('users-list-container');
                if (!container) return;

                if (cachedUsers.length === 0) {
                    container.innerHTML = `<div style="text-align: center; color: var(--clr-text-muted); padding: 32px; grid-column: 1 / -1; font-weight: 600;">${translations[currentLang].noUsersRegistered}</div>`;
                    return;
                }

                container.innerHTML = cachedUsers.map(u => {
                    const emailEscaped = encodeURIComponent(u.email);
                    return `
                        <div class="user-card-item" style="border: 1px solid var(--clr-border); border-radius: 8px; padding: 16px; background-color: var(--clr-bg); display: flex; flex-direction: column; justify-content: space-between; gap: 8px; position: relative;">
                            <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;">
                                <div style="display: flex; flex-direction: column; gap: 4px;">
                                    <span style="font-weight: 700; color: var(--clr-text-main); font-size: 15px;">${u.name}</span>
                                    <span style="color: var(--clr-text-muted); font-size: 13px; word-break: break-all;">${u.email}</span>
                                </div>
                                <div style="display: flex; gap: 6px;">
                                    <button class="btn-edit-user" onclick="editUserFromUI('${emailEscaped}', '${encodeURIComponent(u.name)}')" title="${translations[currentLang].editUserTooltip}" style="background: none; border: none; color: var(--clr-primary); cursor: pointer; padding: 4px; display: inline-flex; align-items: center; border-radius: 4px; transition: all 0.2s;">
                                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                            <path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                        </svg>
                                    </button>
                                    <button class="btn-delete-user" onclick="deleteUserFromUI('${emailEscaped}')" title="${translations[currentLang].deleteUserTooltip}" style="background: none; border: none; color: #ef4444; cursor: pointer; padding: 4px; display: inline-flex; align-items: center; border-radius: 4px; transition: all 0.2s;">
                                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                            <polyline points="3 6 5 6 21 6"></polyline>
                                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                            <div style="display: flex; align-items: center; gap: 6px; margin-top: 8px; background-color: #ffffff; border: 1px solid var(--clr-border); padding: 6px 10px; border-radius: 6px;">
                                <span style="font-size: 12.5px; font-weight: 600; color: var(--clr-text-muted);">${translations[currentLang].passwordLabel}</span>
                                <input type="password" value="${u.password || ''}" readonly style="border: none; background: none; font-size: 13px; font-family: monospace; font-weight: bold; width: 120px; color: var(--clr-text-main); outline: none; padding: 0;" id="pw-field-${emailEscaped}">
                                <button type="button" onclick="togglePasswordVisibility('${emailEscaped}', this)" style="border: none; background: none; color: var(--clr-primary); font-size: 12px; font-weight: 700; cursor: pointer; padding: 2px 4px; outline: none; margin-left: auto;">${translations[currentLang].showPasswordLabel}</button>
                            </div>
                        </div>
                    `;
                }).join('');
            };

            const fetchUsers = () => {
                fetch(getApiUrl('/api/stats'))
                    .then(res => res.json())
                    .then(data => {
                        cachedUsers = data.users || [];
                        renderUsersList();
                    })
                    .catch(err => console.error('Error fetching users:', err));
            };

            // Toggle password visibility handler
            window.togglePasswordVisibility = (emailEscaped, btn) => {
                const input = document.getElementById(`pw-field-${emailEscaped}`);
                if (input) {
                    if (input.type === 'password') {
                        input.type = 'text';
                        btn.textContent = translations[currentLang].hidePasswordLabel;
                    } else {
                        input.type = 'password';
                        btn.textContent = translations[currentLang].showPasswordLabel;
                    }
                }
            };

            // Delete user handler
            const deleteUser = (email) => {
                const confirmMsg = translations[currentLang].deleteUserConfirm;
                if (!confirm(confirmMsg)) return;

                fetch(getApiUrl('/api/delete-user'), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email })
                })
                .then(res => res.json())
                .then(resData => {
                    if (resData.success) {
                        alert(translations[currentLang].deleteUserSuccess);
                        fetchUsers();
                    } else {
                        alert(translations[currentLang].deleteUserFailed);
                    }
                })
                .catch(err => {
                    console.error('Error deleting user:', err);
                    alert(translations[currentLang].deleteUserFailed);
                });
            };

            window.deleteUserFromUI = (emailEscaped) => {
                const email = decodeURIComponent(emailEscaped);
                deleteUser(email);
            };

            // Edit user handler
            const editUser = (email, currentName) => {
                const data = translations[currentLang];
                const newName = prompt(data.promptEditUserName, currentName);
                if (newName === null) return; // Cancelled
                
                const newPassword = prompt(data.promptEditUserPassword);
                if (newPassword === null) return; // Cancelled
                if (newPassword && newPassword.length < 6) {
                    alert(currentLang === 'en' ? 'Password must be at least 6 characters!' : 'ಗುಪ್ತಪದವು ಕನಿಷ್ಠ 6 ಅಕ್ಷರಗಳಾಗಿರಬೇಕು!');
                    return;
                }
                
                // If nothing was entered/changed, do not send update
                if (!newName && !newPassword) return;

                fetch(getApiUrl('/api/edit-user'), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, name: newName, password: newPassword })
                })
                .then(res => res.json())
                .then(resData => {
                    if (resData.success) {
                        alert(data.editUserSuccess);
                        fetchUsers();
                    } else {
                        alert(data.editUserFailed);
                    }
                })
                .catch(err => {
                    console.error('Error editing user:', err);
                    alert(data.editUserFailed);
                });
            };

            window.editUserFromUI = (emailEscaped, currentNameEscaped) => {
                const email = decodeURIComponent(emailEscaped);
                const currentName = decodeURIComponent(currentNameEscaped);
                editUser(email, currentName);
            };

            // Add User click handler
            const addUserBtn = document.getElementById('add-user-btn');
            if (addUserBtn) {
                addUserBtn.addEventListener('click', () => {
                    const data = translations[currentLang];
                    const email = prompt(data.promptAddUserEmail);
                    if (!email) return;

                    // Simple email format check
                    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    if (!emailPattern.test(email)) {
                        alert(currentLang === 'en' ? 'Invalid email format!' : 'ಅಮಾನ್ಯ ಇಮೇಲ್ ವಿನ್ಯಾಸ!');
                        return;
                    }

                    const name = prompt(data.promptAddUserName);
                    if (!name) return;

                    const password = prompt(data.promptAddUserPassword);
                    if (!password) return;
                    if (password.length < 6) {
                        alert(currentLang === 'en' ? 'Password must be at least 6 characters!' : 'ಗುಪ್ತಪದವು ಕನಿಷ್ಠ 6 ಅಕ್ಷರಗಳಾಗಿರಬೇಕು!');
                        return;
                    }

                    fetch(getApiUrl('/api/add-user'), {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ email, name, password })
                    })
                    .then(res => {
                        if (res.status === 409) {
                            alert(data.addUserExists);
                            return null;
                        }
                        if (!res.ok) {
                            throw new Error('Failed to add user');
                        }
                        return res.json();
                    })
                    .then(resData => {
                        if (resData && resData.success) {
                            alert(data.addUserSuccess);
                            fetchUsers();
                        }
                    })
                    .catch(err => {
                        console.error('Error adding user:', err);
                        alert(data.addUserFailed);
                    });
                });
            }

            // Back button
            if (backDashboardBtn) {
                backDashboardBtn.addEventListener('click', () => {
                    window.location.href = 'admin_dashboard.html';
                });
            }

            // Logout Navigation
            logoutBtn.addEventListener('click', () => {
                window.location.href = 'index.html';
            });

            // Initial setup
            applyTranslations();
            fetchUsers();
            // Refresh list every 5 seconds
            setInterval(fetchUsers, 5000);
        });
    </script>
</body>

</html>
